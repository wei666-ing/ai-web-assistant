<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的 AI 助手</title>
    <style>
        body{ font-family: sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding-top: 50px; }
        .container { width: 500px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #chat-box { height: 400px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 15px; border-radius: 5px; background: #fafafa; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; max-width: 80%; word-wrap: break-word; }
        .user-msg { background: #007bff; color: white; margin-left: auto; text-align: right; }
        .ai-msg { background: #e9ecef; color: black; margin-right: auto; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; outline: none; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h2>AI 聊天助手</h2>
    <div id="chat-box"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="输入你的问题..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">发送</button>
    </div>
</div>

<script>
        let chatHistory = [];

    async function sendMessage() {
        const inputElement = document.getElementById("user-input");
        const message = inputElement.value.trim();
        if (!message) return;

        appendMessage("user", message);
        inputElement.value = ""; 
        chatHistory.push({"role": "user", "content": message});

        // 创建一个空的 AI 消息框，准备往里面填字
        const msgId = appendMessage("ai", "");
        const aiDiv = document.getElementById(msgId);

        try {
            // 注意这里请求的路径变成了 /chat/stream
            const response = await fetch("/chat/stream", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages: chatHistory })
            });

            // 获取读取流
            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let fullReply = "";

            // 循环读取数据块
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                // 把二进制流解码成文字
                const chunkText = decoder.decode(value, { stream: true });
                fullReply += chunkText;
                aiDiv.innerText = fullReply; // 实时更新到页面上
                
                // 自动滚到底部
                const chatBox = document.getElementById("chat-box");
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            // 结束后，把完整的 AI 回复存入历史记录
            chatHistory.push({"role": "assistant", "content": fullReply});

        } catch (error) {
            aiDiv.innerText = "请求失败。";
        }
    }

    function appendMessage(role, text) {
        const chatBox = document.getElementById("chat-box");
        const msgDiv = document.createElement("div");
        const msgId = "msg-" + Date.now(); 
        msgDiv.id = msgId;
        msgDiv.className = `message ${role}-msg`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight; 
        return msgId;
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
</script>

</body>
</html>
