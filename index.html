<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的 AI 助手</title>
    <!-- 引入 Markdown 解析库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 引入代码高亮库及其样式 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding-top: 50px; }
        .container { width: 600px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #chat-box { height: 500px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 15px; border-radius: 5px; background: #fafafa; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; max-width: 85%; word-wrap: break-word; }
        .user-msg { background: #007bff; color: white; margin-left: auto; text-align: right; }
        .ai-msg { background: #e9ecef; color: black; margin-right: auto; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; outline: none; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }

        /* ======= 新增的 Markdown 样式 ======= */
        .ai-msg { white-space: normal; line-height: 1.6; }
        .ai-msg p { margin-top: 0; margin-bottom: 10px; }
        .ai-msg pre { background: #282c34; padding: 10px; border-radius: 5px; overflow-x: auto; }
        .ai-msg code { font-family: Consolas, monospace; background: rgba(0,0,0,0.05); padding: 2px 4px; border-radius: 3px; color: #e83e8c; }
        .ai-msg pre code { background: transparent; padding: 0; color: #abb2bf; }
    </style>
</head>
<body>

<div class="container">
    <h2>AI 聊天助手</h2>
    <div id="chat-box"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="输入你的问题..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">发送</button>
    </div>
</div>

<script>
    let chatHistory = [];

    async function sendMessage() {
        const inputElement = document.getElementById("user-input");
        const message = inputElement.value.trim();
        if (!message) return;

        appendMessage("user", message);
        inputElement.value = ""; 
        chatHistory.push({"role": "user", "content": message});

        const msgId = appendMessage("ai", "");
        const aiDiv = document.getElementById(msgId);

        try {
            const response = await fetch("/chat/stream", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages: chatHistory })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let fullReply = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                const chunkText = decoder.decode(value, { stream: true });
                fullReply += chunkText;
                
                // 【修改点】在这里用 marked 解析 Markdown 并渲染
                aiDiv.innerHTML = marked.parse(fullReply);
                
                // 【修改点】对解析出来的代码块进行高亮处理
                aiDiv.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });
                
                const chatBox = document.getElementById("chat-box");
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            chatHistory.push({"role": "assistant", "content": fullReply});

        } catch (error) {
            aiDiv.innerText = "请求失败。";
        }
    }

    function appendMessage(role, text) {
        const chatBox = document.getElementById("chat-box");
        const msgDiv = document.createElement("div");
        const msgId = "msg-" + Date.now(); 
        msgDiv.id = msgId;
        msgDiv.className = `message ${role}-msg`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight; 
        return msgId;
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
</script>

</body>
</html>
