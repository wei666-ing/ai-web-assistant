<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的 AI 助手</title>
    <!-- Markdown 解析库改为本地文件，不再依赖外网 CDN -->
    <script src="/static/marked.min.js"></script>

    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding-top: 50px; }
        .container { width: 600px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #chat-box { height: 500px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 15px; border-radius: 5px; background: #fafafa; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; max-width: 85%; word-wrap: break-word; }
        .user-msg { background: #007bff; color: white; margin-left: auto; text-align: right; }
        .ai-msg { background: #e9ecef; color: black; margin-right: auto; }
        .error-msg { background: #ffe3e3; color: #b30000; margin-right: auto; font-size: 14px; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; outline: none; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }

        /* ======= 登录 / 注册 ======= */
        .auth-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; font-size: 14px; flex-wrap: wrap; }
        .auth-bar input { flex: 0 0 110px; width: 110px; padding: 8px; font-size: 14px; }
        .auth-bar button { padding: 8px 14px; font-size: 14px; }
        .btn-gray { background: #6c757d; }
        .btn-gray:hover { background: #5a6268; }
        #auth-status { color: #666; font-size: 13px; margin-left: auto; }
        #auth-status.ok { color: #198754; }
        #auth-status.err { color: #b30000; }

        /* ======= Markdown 样式 ======= */
        .ai-msg { white-space: normal; line-height: 1.6; }
        .ai-msg p { margin-top: 0; margin-bottom: 10px; }
        .ai-msg pre { background: #282c34; padding: 10px; border-radius: 5px; overflow-x: auto; }
        .ai-msg code { font-family: Consolas, monospace; background: rgba(0,0,0,0.05); padding: 2px 4px; border-radius: 3px; color: #e83e8c; }
        .ai-msg pre code { background: transparent; padding: 0; color: #abb2bf; }
        .ai-msg ul, .ai-msg ol { margin-top: 0; padding-left: 22px; }
        .ai-msg table { border-collapse: collapse; margin-bottom: 10px; }
        .ai-msg th, .ai-msg td { border: 1px solid #d0d0d0; padding: 4px 8px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>AI 聊天助手</h2>

    <!-- 登录 / 注册：登录成功把 Token 存进 localStorage -->
    <div class="auth-bar">
        <input type="text" id="auth-username" placeholder="用户名">
        <input type="password" id="auth-password" placeholder="密码" onkeypress="handleAuthKeyPress(event)">
        <button onclick="login()">登录</button>
        <button class="btn-gray" onclick="register()">注册</button>
        <button class="btn-gray" id="logout-btn" onclick="logout()" style="display:none;">退出</button>
        <span id="auth-status">未登录（登录后才能聊天）</span>
    </div>

    <div id="chat-box"></div>
    <div style="margin-bottom: 10px; font-size: 14px; color:#555;">
        <label>
            <input type="checkbox" id="use-rag">
            开启私有知识库问答 （RAG）
        </label>
    </div>
        <!-- 单独的文件上传区 -->
    <div style="margin-bottom: 10px; display: flex; align-items: center;">
        <input type="file" id="file-upload" accept=".pdf,.txt" style="font-size: 14px; color: #555;">
    </div>

    <!-- 聊天输入区 -->
    <div class="input-area">
        <input type="text" id="user-input" placeholder="输入你的问题..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">发送</button>
    </div>
</div>

<script>
    let chatHistory = [];
    let msgSeq = 0;
    const MAX_HISTORY = 20;   // 发给后端时最多带最近 20 条，避免上下文越来越长

    // ================= 登录 / Token =================
    function getToken() {
        return localStorage.getItem("token");
    }

    // 所有请求统一走这里加 Authorization，避免哪个 fetch 漏写
    function authHeaders(extra) {
        const headers = Object.assign({}, extra || {});
        const token = getToken();
        if (token) headers["Authorization"] = "Bearer " + token;
        return headers;
    }

    function setAuthStatus(text, type) {
        const el = document.getElementById("auth-status");
        el.innerText = text;
        el.className = type || "";
    }

    function updateAuthUI() {
        const username = localStorage.getItem("username");
        const loggedIn = !!getToken();
        document.getElementById("logout-btn").style.display = loggedIn ? "" : "none";
        if (loggedIn) {
            setAuthStatus("已登录：" + (username || "用户") + "（历史记录会保存到你的账号）", "ok");
        } else {
            setAuthStatus("未登录（登录后才能聊天和保存历史）", "");
        }
    }

    async function handleAuth(url) {
        const username = document.getElementById("auth-username").value.trim();
        const password = document.getElementById("auth-password").value;

        if (!username || !password) {
            setAuthStatus("请先填写用户名和密码", "err");
            return;
        }

        // 前端先做一遍校验，省掉无意义的请求（登录不校验密码长度，避免误拦老账号）
        if (username.length < 3 || username.length > 20) {
            setAuthStatus("用户名长度需为 3-20 个字符", "err");
            return;
        }
        if (!/^[A-Za-z0-9_\u4e00-\u9fa5]+$/.test(username)) {
            setAuthStatus("用户名只能包含中文、字母、数字和下划线", "err");
            return;
        }
        if (url === "/register" && (password.length < 6 || password.length > 32)) {
            setAuthStatus("密码长度需为 6-32 个字符", "err");
            return;
        }

        try {
            const resp = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            let data = {};
            try { data = await resp.json(); } catch (e) {}
            if (!resp.ok) {
                // FastAPI 的 422 校验错误里 detail 是数组，取第一条的 msg，避免显示成一串对象
                const detail = Array.isArray(data.detail)
                    ? (data.detail[0] && data.detail[0].msg) || "请求参数不合法"
                    : data.detail;
                throw new Error(detail || ("HTTP " + resp.status));
            }

            if (url === "/register") {
                setAuthStatus("注册成功，正在自动登录...", "ok");
                await handleAuth("/login");
                return;
            }

            // 登录成功，把 Token 存进浏览器
            localStorage.setItem("token", data.access_token);
            localStorage.setItem("username", username);
            document.getElementById("auth-password").value = "";
            updateAuthUI();

            // 换账号后重新加载这个账号的历史记录
            resetChat();
            await loadHistory();
        } catch (error) {
            setAuthStatus((url === "/register" ? "注册失败：" : "登录失败：") + error.message, "err");
        }
    }

    function login() { return handleAuth("/login"); }
    function register() { return handleAuth("/register"); }

    function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("username");
        resetChat();
        updateAuthUI();
    }

    function handleAuthKeyPress(event) {
        if (event.key === "Enter") login();
    }

    function resetChat() {
        document.getElementById("chat-box").innerHTML = "";
        chatHistory = [];
        msgSeq = 0;
    }

    // 保存消息到数据库（接口已上锁，未登录直接跳过）
    function saveMessage(role, content) {
        if (!getToken()) return;
        fetch(`/save_message?role=${role}&content=${encodeURIComponent(content)}`, {
            method: "POST",
            headers: authHeaders()
        }).catch(err => console.warn("保存消息失败：", err));
    }

    // 把文本安全地转成 HTML（防止模型输出里的 < > & 破坏页面）
    function escapeHtml(text) {
        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }

    // 统一的 Markdown 渲染：有 marked 就用，没有就退化成纯文本，
    // 保证任何情况下都不会因为渲染库缺失而整段变成“请求失败”
    function renderMarkdown(text) {
        text = text == null ? "" : String(text);
        if (window.marked && typeof window.marked.parse === "function") {
            try {
                return window.marked.parse(text);
            } catch (e) {
                console.warn("Markdown 渲染失败，退化为纯文本：", e);
            }
        }
        return "<p>" + escapeHtml(text).replace(/\n/g, "<br>") + "</p>";
    }

    // 统一的 POST + 错误检查：4xx/5xx 直接抛出，带状态码和响应体
    async function postJSON(url, payload) {
        const resp = await fetch(url, {
            method: "POST",
            headers: authHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify(payload)
        });
        if (!resp.ok) {
            let detail = "";
            try { detail = (await resp.text()).slice(0, 200); } catch (e) {}
            throw new Error("HTTP " + resp.status + (detail ? "：" + detail : ""));
        }
        return resp;
    }

    async function sendMessage() {
        // 聊天接口已上锁，未登录就地提示，不用等 401
        if (!getToken()) {
            setAuthStatus("请先登录再聊天", "err");
            document.getElementById("auth-username").focus();
            return;
        }

        const inputElement = document.getElementById("user-input");
        const message = inputElement.value.trim();
        if (!message) return;

        appendMessage("user", message);
        inputElement.value = "";
        chatHistory.push({ "role": "user", "content": message });

        // 把用户消息存入数据库
        saveMessage("user", message);

        const aiDiv = setupMessage("ai", "");

        const isRagMode = document.getElementById("use-rag").checked;
        const historyToSend = chatHistory.slice(-MAX_HISTORY);

        try {
            if (isRagMode) {
                // ======== RAG 模式 ========
                aiDiv.innerText = "正在检索知识库...";
                const response = await postJSON("/chat/rag", { messages: historyToSend });
                const data = await response.json();

                if (!data || data.reply == null) {
                    throw new Error("后端没有返回 reply 字段");
                }

                aiDiv.innerHTML = renderMarkdown(data.reply);
                chatHistory.push({ "role": "assistant", "content": data.reply });

                saveMessage("assistant", data.reply);

            } else {
                // ======== 正常流式模式 ========
                const response = await postJSON("/chat/stream", { messages: historyToSend });

                if (!response.body) {
                    throw new Error("当前浏览器不支持流式读取 response.body");
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let fullReply = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    fullReply += decoder.decode(value, { stream: true });

                    // 流式过程中如果只收到半个代码块，marked 也能勉强渲染，失败就走降级
                    aiDiv.innerHTML = renderMarkdown(fullReply);

                    const chatBox = document.getElementById("chat-box");
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
                fullReply += decoder.decode();

                if (!fullReply.trim()) {
                    throw new Error("后端返回了空内容（可能是模型接口报错，去看运行 uvicorn 的那个终端）");
                }

                aiDiv.innerHTML = renderMarkdown(fullReply);
                chatHistory.push({ "role": "assistant", "content": fullReply });

                saveMessage("assistant", fullReply);
            }

        } catch (error) {
            console.error("发送消息失败：", error);
            // 把真实原因显示出来，而不是笼统的“请求失败”
            aiDiv.className = "message error-msg";
            aiDiv.innerText = "请求失败：" + (error && error.message ? error.message : String(error));
            const chatBox = document.getElementById("chat-box");
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    // 生成一条消息气泡，返回它的 DOM 元素（用自增序号，避免同一毫秒内 id 重复）
    function setupMessage(role, text) {
        const chatBox = document.getElementById("chat-box");
        const msgDiv = document.createElement("div");
        msgSeq += 1;
        msgDiv.id = "msg-" + msgSeq;
        msgDiv.className = `message ${role}-msg`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msgDiv;
    }

    function appendMessage(role, text) {
        return setupMessage(role, text).id;
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }

    async function loadHistory() {
        // 没登录就不请求，避免控制台一片 401
        if (!getToken()) {
            updateAuthUI();
            return;
        }
        try {
            const response = await fetch("/history", { headers: authHeaders() });

            // Token 过期 / 无效
            if (response.status === 401) {
                localStorage.removeItem("token");
                localStorage.removeItem("username");
                updateAuthUI();
                setAuthStatus("登录已过期，请重新登录", "err");
                return;
            }
            if (!response.ok) throw new Error("HTTP " + response.status);
            const history = await response.json();

            history.forEach(msg => {
                if (msg.role === "ai" || msg.role === "assistant") {
                    const aiDiv = setupMessage("ai", "");
                    aiDiv.innerHTML = renderMarkdown(msg.content);
                    chatHistory.push({ "role": "assistant", "content": msg.content });
                } else {
                    setupMessage("user", msg.content);
                    chatHistory.push({ "role": "user", "content": msg.content });
                }
            });

            const chatBox = document.getElementById("chat-box");
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (error) {
            console.error("加载历史记录失败", error);
        }
    }

    document.getElementById("file-upload").addEventListener("change", async (event) => {
        const file = event.target.files[0];
        if (!file) return;

        // 上传接口也已上锁
        if (!getToken()) {
            setupMessage("ai", "📄 请先登录再上传文件");
            setAuthStatus("请先登录再上传文件", "err");
            event.target.value = "";
            return;
        }

        const formData = new FormData();
        formData.append("file", file);

        setupMessage("ai", "📄 正在上传并解析文件，请稍候...");

        try {
            // 上传走 FormData，不要手写 Content-Type，但 Authorization 必须带上
            const response = await fetch("/upload", { method: "POST", headers: authHeaders(), body: formData });
            if (!response.ok) throw new Error("HTTP " + response.status);

            const result = await response.json();
            if (result.success) {
                setupMessage("ai", "📄 文件上传并解析成功！");
            } else {
                setupMessage("ai", "📄 文件上传失败：" + (result.error || "未知错误"));
            }
        } catch (error) {
            console.error("文件上传出错", error);
            setupMessage("ai", "📄 文件上传出错：" + error.message);
        } finally {
            event.target.value = "";   // 允许再次选择同一个文件
        }
    });

    window.onload = function () {
        // 直接双击打开 html 时，请求会发到 file:// 协议上，必然失败，这里先提示清楚
        if (location.protocol === "file:") {
            const tip = document.createElement("div");
            tip.className = "message error-msg";
            tip.innerText = "请通过 http://127.0.0.1:8000 打开本页面（先在项目目录运行 python -m uvicorn main:app --reload），不要直接双击 index.html。";
            document.getElementById("chat-box").appendChild(tip);
            return;
        }
        updateAuthUI();
        loadHistory();
    };
</script>
</body>
</html>
